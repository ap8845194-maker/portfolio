<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Ayush Portfolio</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                Ayush<span>.</span>
            </div>

            <p class="label">
                ADMIN PANEL
            </p>

            <h1>
                Welcome Back
            </h1>

            <p class="subtitle">
                Login to manage your portfolio.
            </p>


            <form id="loginForm">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="admin@example.com"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p id="loginStatus"></p>

            <a
                href="../index.html"
                class="back-link"
            >
                ← Back to Portfolio
            </a>

        </div>

    </div>


    <script
        type="module"
        src="admin.js"
    ></script>

</body>

</html>
